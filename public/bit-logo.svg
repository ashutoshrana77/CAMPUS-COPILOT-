<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bitSun" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b2265" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Navy Circle -->
  <circle cx="120" cy="120" r="116" fill="#0b257a" stroke="url(#goldGradient)" stroke-width="6" />
  <circle cx="120" cy="120" r="108" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Inner Ring Divider -->
  <circle cx="120" cy="120" r="76" fill="url(#bitSun)" stroke="url(#goldGradient)" stroke-width="4" />

  <!-- Sun rays behind the shield -->
  <g stroke="#fef08a" stroke-width="2.5" opacity="0.85">
    <line x1="120" y1="46" x2="120" y2="58" />
    <line x1="102" y1="50" x2="107" y2="60" />
    <line x1="138" y1="50" x2="133" y2="60" />
    <line x1="86" y1="58" x2="94" y2="66" />
    <line x1="154" y1="58" x2="146" y2="66" />
    <line x1="74" y1="72" x2="84" y2="78" />
    <line x1="166" y1="72" x2="156" y2="78" />
  </g>

  <!-- Top Text: BIT -->
  <text x="120" y="35" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="4">
    BIT
  </text>

  <!-- Rosettes -->
  <g fill="#fbbf24" stroke="#78350f" stroke-width="0.6">
    <circle cx="70" cy="34" r="10" fill="#fbbf24" />
    <circle cx="70" cy="34" r="5" fill="#0b257a" />
    <circle cx="170" cy="34" r="10" fill="#fbbf24" />
    <circle cx="170" cy="34" r="5" fill="#0b257a" />
    <circle cx="26" cy="115" r="9" fill="#fbbf24" />
    <circle cx="26" cy="115" r="4" fill="#0b257a" />
    <circle cx="214" cy="115" r="9" fill="#fbbf24" />
    <circle cx="214" cy="115" r="4" fill="#0b257a" />
    <circle cx="65" cy="195" r="9" fill="#fbbf24" />
    <circle cx="175" cy="195" r="9" fill="#fbbf24" />
  </g>

  <!-- Bottom Text: INDIA -->
  <text x="120" y="214" fill="#ffffff" font-size="21" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="4">
    INDIA
  </text>

  <!-- Heraldic Shield in Center -->
  <g>
    <path d="M 76 75 C 76 75, 120 72, 120 72 C 120 72, 164 75, 164 75 C 164 122, 148 152, 120 166 C 92 152, 76 122, 76 75 Z" fill="url(#shieldGrad)" stroke="url(#goldGradient)" stroke-width="3.5" />
    <!-- Pedestal & Diya -->
    <rect x="105" y="132" width="30" height="6" rx="2" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />
    <rect x="110" y="127" width="20" height="5" rx="1.5" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />
    <path d="M 94 108 C 96 122, 110 128, 120 128 C 130 128, 144 122, 146 108 C 152 108, 158 114, 155 120 C 152 126, 142 125, 142 125 C 138 129, 130 130, 120 130 C 108 130, 98 126, 94 108 Z" fill="url(#goldGradient)" stroke="#78350f" stroke-width="1" />
    <ellipse cx="148" cy="116" rx="6" ry="8" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <ellipse cx="120" cy="108" rx="8" ry="4" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />
    <circle cx="120" cy="104" r="3" fill="#fef08a" />
    <path d="M 97 106 C 96 98, 98 94, 99 92 C 101 95, 102 99, 101 106 Z" fill="#fef08a" stroke="#f59e0b" stroke-width="1" />
  </g>

  <!-- Flourishing Leaves -->
  <path d="M 72 102 C 60 114, 52 136, 68 152 C 76 142, 74 120, 72 102 Z" fill="#fbbf24" opacity="0.95" stroke="#78350f" stroke-width="0.8" />
  <path d="M 168 102 C 180 114, 188 136, 172 152 C 164 142, 166 120, 168 102 Z" fill="#fbbf24" opacity="0.95" stroke="#78350f" stroke-width="0.8" />

  <!-- Ribbon Banner at bottom: सिद्धिर्भवति कर्मजा -->
  <g>
    <path d="M 52 166 C 70 178, 170 178, 188 166 C 182 178, 172 188, 120 188 C 68 188, 58 178, 52 166 Z" fill="#fbbf24" stroke="#78350f" stroke-width="1.2" />
    <polygon points="52,166 42,176 56,177" fill="#d97706" />
    <polygon points="188,166 198,176 184,177" fill="#d97706" />
    <text x="120" y="179" fill="#0b2265" font-size="10.5" font-weight="bold" font-family="'Plus Jakarta Sans', Arial, sans-serif" text-anchor="middle" letter-spacing="0.5">
      सिद्धिर्भवति कर्मजा
    </text>
  </g>
</svg>
